[project]
name = "artist-agent"
version = "0.1.0"
description = "Daily generative-art agent: composes a prompt from evolving interests, generates via Draw Things, self-critiques, writes a portable markdown item"
requires-python = ">=3.12"
dependencies = [
    "local-first-common[anthropic]",
    "python-frontmatter>=1.1.0",
    "requests>=2.32.5",
    "typer>=0.24.1",
]

[project.scripts]
artist-agent = "artist_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artist_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
